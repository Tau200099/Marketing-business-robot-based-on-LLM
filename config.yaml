# ============================================================
# 飞书群机器人 · 配置
#
# 两层结构：
#   第一层 rules  —— 确定性关键词规则，本地匹配，微秒级，零成本
#   第二层 agent  —— 规则没命中时，交给模型判断意图并生成回复
#
# 改完这个文件 5 秒内自动热加载，不用重启。
# 但如果改的是 feishu_bot/*.py 代码，必须重启进程。
# ============================================================

global:
  # 用哪个平台：feishu | wecom
  #   feishu 长连接，群里所有消息（含图片）都能收到
  #   wecom  智能机器人长连接 @ 模式：【只收 @机器人 的消息】（平台限制，
  #          轮询接口对 10 人以上企业不开放），所以晒单一律要 @机器人。
  #          发文字走 MCP（可选），发图 / 发文件 / 下载走长连接。
  platform: wecom

  # 只响应 @ 了机器人的消息。
  #   true  -> 仅需权限 im:message.group_at_msg:readonly（申请即批）
  #   false -> 监听群里所有消息，必须先申请到 im:message.group_msg 并通过管理员审批
  require_at: false

  # 是否响应单聊（私聊机器人）消息
  enable_p2p: true

  # 是否响应群聊消息
  enable_group: true

  # 忽略机器人自己发的消息，防止自问自答死循环。务必保持 true
  ignore_self: true

  # 同一条规则在同一个会话里的最小触发间隔（秒），0 = 不限
  default_cooldown: 10

  # 每隔多少秒检查一次 config.yaml 是否变更并热加载，0 = 关闭
  hot_reload: 5

  # 命中多条规则时：first = 只回第一条，all = 每条都回
  match_strategy: first


# ============================================================
# 图片 OCR
#
# 业务内容在「今日水印相机」拍的现场照里，所以这层是必需的 ——
# 关掉的话图片消息会被当成空文本直接丢弃，机器人对所有照片完全无反应，
# 而且日志里看不到。
#
# OCR 全程在本机跑（RapidOCR + onnxruntime，离线、无需 GPU），
# 图片本身绝不外传。
#
# ⚠️ OCR 之后还有一道【提纯】（feishu_bot/distill.py），只保留
# 「工作内容」字段，并抹掉手机号和身份证号 —— 现场照可能拍到客户证件，
# 实测样本里就出现过。那一步是隐私闸门，不要绕过。
#
# 实测（i5-9300H，1279x1706 现场照）：缩图后约 3 秒/张。
# ============================================================
ocr:
  enabled: true

  # OCR 前把长边缩到这个尺寸。手机拍的现场照动辄 1900x2500。
  # 实测（5 张真实照片）：
  #   1280  时间字段只认出 3/5   3.4 秒/张
  #   1600  时间字段认出 4/5     4.4 秒/张   <- 判重要用时间，选这档
  #   1920  时间字段认出 4/5     4.5 秒/张
  # 时间字段字号小，缩太狠会糊掉，直接影响重复图片判定。0 = 不缩。
  max_side: 1600

  # OCR 全文的安全上限，只防极端情况。提纯后给模型的通常只有十几二十个字，
  # 真正的长度由提纯管。【别调小】：水印（工作内容 / 支局 / 时间）在照片底部、
  # OCR 全文的末尾，上限太小会把它切掉 —— 以前是 500，密集的纸质单照片就中招。
  max_chars: 4000

  # 低于这个置信度的行丢掉，减少 OCR 噪声。
  # 如果发现「工作内容」经常识别不出来，可以调到 0.3 试试
  min_score: 0.5

  # 一条消息最多处理几张图，防止有人一次发几十张把进程拖住
  max_images: 3


# ============================================================
# 第二层：模型判断
#
# 只有通过 prefilter 粗筛的消息才会调模型 —— 群里绝大部分闲聊在本地
# 就被丢掉了，不产生任何 API 调用。这是把成本和延迟压住的关键。
#
# 国内几家（DeepSeek / 豆包 / 通义 / 智谱 / Kimi）都提供 OpenAI 兼容接口，
# 换服务商只改 base_url 和 model 两行：
#   DeepSeek  https://api.deepseek.com              deepseek-chat
#   豆包方舟   https://ark.cn-beijing.volces.com/api/v3   你的推理接入点 ID
#   通义百炼   https://dashscope.aliyuncs.com/compatible-mode/v1   qwen-plus
#   智谱      https://open.bigmodel.cn/api/paas/v4   glm-4-flash
#   电信星辰   https://wishub-x1.ctyun.cn/v1          telechat-115b
#
# 电信星辰（天翼云 MaaS）有两条接入路径，凭证类型决定走哪条：
#   路径A  只有 APP key -> 就用上面那行，标准 Bearer 鉴权，不用改别的
#   路径B  还给了订单编号 -> 接口是 /aipaas/lm/v1/telechat/completions115，
#          需要额外请求头，且 token 字段名不一样，按下面这样配：
#            base_url: https://wishub-x1.ctyun.cn/aipaas/lm/v1/telechat
#            model: telechat-115b
#            max_tokens_field: max_completion_tokens
#            extra_headers:
#              X-APP-ID: ${TELECOM_APP_ID}     # 值从 .env 取，别写死在这里
#              Order-Num: ${TELECOM_ORDER_NUM}
#          注意 base_url 末尾要落在 /chat/completions 之前那一段，
#          路径B 的结尾是 completions115 而不是 chat/completions，
#          对不上的话得改 llm.py，先用 test_llm.py 验一下再说。
#
# 换完用 python test_llm.py 验证 —— 它会把 URL、请求头、完整返回都打出来。
# ============================================================
agent:
  enabled: true

  base_url: https://api.deepseek.com
  model: deepseek-chat
  # API Key 从环境变量读，不写在配置文件里。名字对应 .env 里的键
  api_key_env: LLM_API_KEY

  timeout: 8          # 秒，超时就按「模型不可用」处理
  temperature: 0.8    # 高一点让回复措辞有变化，不至于每次一样
  max_tokens: 300

  # 回复时 @ 报单的人
  at_sender: true

  # 每分钟最多调用多少次。防止群里突然刷屏把 API 费用打上去，
  # 超出后本分钟内剩余消息直接跳过（会打日志）。0 = 不限
  max_calls_per_minute: 60

  # 模型不可用时（超时/报错/返回格式不对）：
  #   skip     -> 不回复（默认，安全：漏回一条业绩，好过给报障消息回一句「点赞」）
  #   fallback -> 回复下面的 fallback_reply
  on_error: skip
  fallback_reply: "点赞！！！👍👍"

  # ----------------------------------------------------------
  # 第一层粗筛：消息里出现下列任意一个词，才会调模型。
  #
  # 这层宽一点没关系 —— 宁可多筛进来让模型判断，也别在这里做精细过滤。
  # 精细判断（是报单还是报障）正是模型的活，不要在这里写排除词。
  #
  # 纯数字会自动套「前后不能是数字」的边界：79 命中「79元」，不命中「179」。
  # ----------------------------------------------------------
  prefilter: [
    # 【最重要的一个】图片经过提纯后一律是「工作内容：xxx」的形式，
    # 所以这一个词就能接住全部水印相机照片，不会漏。
    "工作内容",
    # 套餐档位。纯数字自动套「前后不能是数字」边界：139 命中「新增139」，不命中「1139」
    "79", "99", "139", "149", "169", "199", "239", "299", "399",
    # 产品名
    "FTTR", "Fttr", "融合", "智屏", "宽带", "副宽", "云盒",
    # 号卡类。不加的话「山城卡一张」这种纯文字报单会在粗筛就被丢掉，
    # 机器人永远不回，而且日志里都看不到（实测踩过）
    "山城卡", "号卡", "单C", "携转", "异网", "副卡", "橙分期",
    # 单宽 / 亲情宽带 / 5G-A 融合 / 存量迁转的叫法
    "单宽", "包年", "亲情宽带", "5G-A", "美好家", "平迁", "高迁", "提值", "拆机维系",
    # 业务动作
    "新增", "续约", "续签", "办理", "装机", "开通", "新装", "升级", "加装", "预约上门",
    # 纯文字报单的口语说法 —— 这批不含数字也不含产品名，
    # 没有这些词就会被直接丢弃，机器人永远不回，而且日志里看不到
    "办了", "办好", "装了", "成了", "签了", "下单", "出单", "报单", "搞定", "一单", "一户",
  ]

  # ----------------------------------------------------------
  # 业务背景，会拼进系统提示词。写清楚业务场景和套餐档位，
  # 模型判断会准很多。有新套餐、新产品就在这里加一句。
  # ----------------------------------------------------------
  context: |
    群的背景：中国电信一线营销团队的业绩群。销售人员在外面跑业务，
    办成一单就用「今日水印相机」拍张现场照发到群里报单，同事互相点赞鼓励。

    【你收到的文本已经过提纯】
    水印照片里除了业务信息，还有海拔、支局、防伪码、活动名称、时间地点等，
    这些噪声已经在本地被剥掉了。你拿到的通常是这种形式：

        工作内容：新增139+10
        工作内容：预约上门，199续约FTTR
        工作内容：139改169+Fttr+2
        工作内容：预约上门，新增149融合
        工作内容：239续签+FTTR+15小合约

    只要是「工作内容：」开头、并且描述了【已经办成】的业务动作，就算报单，
    is_report 填 true。这是群里报单的主要形式，不要因为看不到
    「受理成功」之类的字样就判定不是报单 —— 水印照片里本来就没有那些字段。

    【⚠️「预约上门」怎么算，这是最容易判错的一条】
    「预约上门」指的是约客户上门装机的环节，不代表单没成。
    判断只看【有没有写具体业务】，不要因为出现「预约上门」就否定：

      有具体业务（新增/续约/续签/改档 + 档位或产品）-> is_report = true
        「工作内容：预约上门新增139亲情宽带」   -> true，is_new=true，package=139
        「工作内容：预约上门，199续约FTTR」     -> true，is_new=false，package=199
        「工作内容：预约上门，新增149融合」      -> true，is_new=true，package=149

      光写预约、没有任何具体业务 -> is_report = false
        「工作内容：预约上门」                 -> false
        「工作内容：今天预约了3户」             -> false
        「工作内容：走访客户」                 -> false

    【号卡类业务 —— 也是报单，别漏了】
    除了宽带，还有一类是【号卡】业务，同样要 is_report = true：

        工作内容：携转异网卡        携号转网，把别家的号转过来，算新增卡
        工作内容：新增19山城卡      山城卡是号卡产品，档位 19/39/59/99/159
        工作内容：单C 39           单C 就是单办号卡；「5G单C99」也是号卡
        工作内容：办理号卡
        工作内容：新增副卡
        工作内容：59返30橙分期      橙分期是号卡的分期产品（送手机），
        工作内容：橙分期399        「橙分期399」是 399 档的【号卡】，不是 399 宽带！

    这类的填法和宽带不一样：
      · broadband_count 和 high_count 都填 0 —— 【号卡不是宽带，也不算中高套】
      · package 填产品名，如「携转异网卡」「19山城卡」「59返30橙分期」「橙分期399」
      · is_new：携转、新增、新办 -> true

    ⚠️ 实测漏判过：「工作内容：携转异网卡」被判成「不是报单」，
    因为背景里只讲了宽带套餐。号卡也是要点赞的业绩。

    【业务动作类型】
      新增 / 新装 / 新入网 —— 新办的单，is_new 填 true
      携转 / 携号转网 —— 把别家的号转过来，算新增，is_new 填 true
      亲情宽带 —— 新装的 79/99 融合宽带，is_new 填 true
      续约 / 续签 —— 老客户续，is_new 填 false
      改 / 升级 / 升档 / 高迁 / 提值 —— 升档，例如「139改169」是从139升到169，is_new 填 false
      平迁 —— 换成同价位的新版套餐，is_new 填 false
      加装 / 融合 / 叠加 —— 在原有基础上加云盒/AI/智屏/FTTR，is_new 填 false
      拆机维系 —— 挽留要拆机的老用户，is_new 填 false
      提速 / 网龄提速 / 1元提速 —— 老用户 1 元提速，is_new 填 false，
                                package 填空，broadband_count 和 high_count 都填 0

    ⚠️ is_new 只在消息里【明确出现】新增、新办、新装、新开这类字眼时才填 true。
    看不出是新增还是续约的（例如「今天办了个199」「搞定一单」），
    一律填 false —— 新增单的回复分量最重，不能让含糊的单白蹭。

    【纯文字的口语报单也算】
    群里也有人不发照片、直接打字报单，说法很随意，同样要回复：
      「搞定一单」「又签了一个」「今天成了两个」「刚办好一户」「出单啦」
    这类看不出套餐档位，package 填空字符串、is_new 填 false 即可，
    但 is_report 必须填 true —— 只要是在报告自己刚完成的业务就算数。

    【融合套餐档位】（单位：元/月）
      399 / 299 / 239   美好家 5G-A 尊享，2000M（需 FTTR）
      199               美好家 5G-A，1000M
      169               500M，有条件升 1000M
      139               500M
      99                300M
      79                200M
    ⚠️ 149 / 179 / 209 / 249 这种数【不是档位】，是「档位 + 10 元附加」写成了总额：
       149 = 139+10，179 = 169+10，209 = 199+10。package 填去掉附加后的基础档位。
    【附加项】写在「+」后面的都不是档位：+10 云盒 / +10 AI视联网 / +9.9 AI守护 /
       +25 或 +10 智屏 / +25 FTTR / +1 提速 / +15 小合约 / 副卡。「R」= FTTR。
    【单宽带】包月 198/138/98/68，包年 1990/1390/990/690/390；副宽 38 或 60 元/月。
       这些算新增宽带（broadband_count 1），但没有融合档位，high_count 填 0，
       package 填原文，如「138单宽」「1390包年」。
    【权益金】699 / 1200 / 1298 / 500 / 750 这类是权益金币，不是档位也不是套餐，
       「699权益兑换FTTR」里的 699 不要填进 package。
    【产品】FTTR（千兆光宽，一主一从）、融合套餐、宽带、副宽、智屏、云盒、AI视联网、摄像头

    【中高套定义 —— 战报计数要用，改政策就改这里】
      中套：139、149、169
      高套：199、239、299、399
      79 和 99 不算中高套。
      合起来「中高套」= 档位 139 及以上。

    【副宽怎么算 —— 战报计数要用】
      副宽是主宽带之外额外加的一条宽带，算独立的一个新增宽带，
      但它没有自己的套餐档位，所以不计入中高套。
      例：「新增199+副宽」= 2 个新增宽带、1 个新增中高套。

    【怎么填 package】取工作内容里的主套餐档位。
      「新增139+10」-> 139      「139改169+Fttr+2」-> 169（升到的那档）
      「239续签+FTTR+15小合约」-> 239        「新增149」-> 139（149 是 139+10 的总额）
      「新增5G-A 299」-> 299                  看不出档位就填空字符串。
    数字后面的「+10」「+2」「+15小合约」是附加项，不要当成套餐档位。

    【以下不是报单，不要回复】
      同事之间的点赞附和：「点赞」「厉害」「牛」「优秀」「恭喜」「加油」
        以及「199牛啊」「这个月你第几单了」这种夸别人的话 ——
        判断标准是：说话人是不是在报告自己刚完成的业务。不是就一律不回。
      报障报修（宽带坏了、断网、掉线、用不了）
      咨询提问（什么时候能装、怎么办理、多少钱）
      售后退订（要退、取消、拆机）
      进度汇报和统计（完成率、还差几单、排名、目标）
      日常闲聊、通知、会议安排

    回复的具体话术见下面的 reply_style，按新增/续约分档。
    看不出具体档位就只点赞，别瞎猜数字。

  # ----------------------------------------------------------
  # 按业务类型分档的回复话术。
  #
  # 新增是含金量最高的单，语气要给足；续约/续签/升档也算业绩，
  # 但分量不如新增，语气要克制，不然一视同仁反而显不出新增的分量。
  #
  # 模型判断出 is_new 之后，按对应那档的要求生成回复。
  # ----------------------------------------------------------
  # emoji 说明：企微这套接口【发不了表情包图片】—— 图片消息要求 media_id，
  # 而 media_id 只能由 file_upload 接口上传获得，那个接口没在 MCP 里开放
  # （服务器只提供 6 个工具，没有上传能力）。所以只能用文字 emoji。
  reply_style:
    new: |
      新增是最有含金量的单，要给足分量。
      语气热烈、有仪式感，用 3~4 个 emoji，结尾多堆两个更显热闹。
      明确点出「新增」两个字和套餐档位，让群里一眼看出这是新单。

      emoji 要换着用，别每条都是 👍。可以从这些里挑：
      🎉 🎊 👏 🔥 💪 🚀 ⭐ 🌟 ✨ 🏆 🥇 👍 💯 ❤️ 😄 🙌 📈 🎯
      同一条里尽量不重复同一个表情，除非是结尾连用来加强语气。

      例如：
        「新增 139，漂亮！🎉👏🔥」
        「139 新增拿下 💪🚀⭐」
        「新增 199 到手，这单含金量高！🏆✨👏」

    renew: |
      续约、续签、升档也算业绩，但分量不如新增，语气要克制一些。
      一句话，2 个 emoji，不要用「炸裂」「王炸」这类特别激动的词。
      点出具体动作和档位。

      emoji 从这些里挑，别每条都是 👍：
      👍 👏 💪 ⭐ ✨ 😄 🙌 💯 🎯

      例如：
        「199 续约 FTTR，稳 👍💪」
        「139 升 169，不错 👏⭐」

# ============================================================
# 支局战报
#
# 每来一单【新增】，按（当天日期 × 支局）累计两个数，然后在基础点赞
# 之后追发一条战报，并 @ 报单的人：
#
#   broadband 新增宽带数 —— 主宽算 1 个，每个副宽再各算 1 个
#                     例「新增199+副宽」= 2 个
#   high      新增中高套数 —— 档位 139 及以上的算，副宽没有独立档位不计
#                     例「新增199+副宽」= 1 个
#
# 这两个数由模型从工作内容里数出来（不是代码里正则数的，
# 「+副宽」「带个副宽」「2个副宽」写法太多，正则数不准）。
# 中高套的档位范围定义在 agent.context 里，改政策改那儿。
#
# 只有新增计数。续约、续签、升档、预约上门都不计。
#
# 支局从照片水印里提取。识别不出支局的照片会跳过战报（会打日志）——
# 播一条没有支局名的战报没意义，还会让那个支局的计数对不上。
#
# 计数落盘到 state_file，重启/断网/关机都不丢；跨天自动清零。
# ============================================================
tally:
  enabled: true

  # 计数文件，相对项目根目录。已在 .gitignore 里
  state_file: tally.json

  # 战报话术。
  #   {branch}  支局名，如「万盛支局」
  #   {parts}   下面两个分段拼接的结果
  #
  # 【累计为 0 的项不会出现】—— 只加了宽带没加中高套时，播的是
  #   恭喜万盛支局新增宽带破"3"！👍👍👍👍
  # 而不是「…、新增中高套破"0"！」那种读着很怪的写法。
  template: '恭喜{branch}{parts}！👍👍👍👍'

  # 分段话术，{count} 是该项当天累计
  part_broadband: '新增宽带破"{count}"'
  part_high: '新增中高套破"{count}"'
  part_sep: '、'


# ============================================================
# 重复内容检测
#
# 判重依据：水印时间 + 工作内容【都一致】才算重复。
# 只用时间会误伤 —— 两个人恰好同一分钟拍照是有可能的。
#
# 命中重复时：不计入战报、也不发基础点赞，只发一条警告并 @ 发送者。
# 否则重发一次就能把战报数字刷上去，统计就没意义了。
#
# 判重范围是全群；指纹存在 tally.json 里，跨天和战报一起清零。
#
# 水印时间抽不到的照片会跳过判重（会打日志）—— 实测 5 张真实照片全部
# 能抽到，但前提是 ocr.max_side 不低于 1600，时间字号小，缩太狠会糊。
# 纯文字消息没有时间，也一律跳过判重。
# ============================================================
dedupe:
  enabled: true

  # 警告话术。占位符 {stamp} 是识别到的水印时间
  # {stamp} 是判重依据：图片是水印时间，文字晒单是单号（如「8月30日第12单」）。
  # 所以话术里不写死「水印时间」——文字报单没有水印，那样读着莫名其妙。
  template: "⚠️ 这条和今天发过的重复了（{stamp}），本单不计入统计。如果确实是新单，请重新提交。"


# ============================================================
# 第一层：确定性规则
#
# 命中就秒回，不走模型。适合放「必须稳定、不能有变化」的东西。
# 规则没命中的消息才会流到 agent。
# ============================================================
rules:
  # 链路自检。触发词没人平时会说，留着不影响群里，
  # 以后排查「机器人是不是还活着」很有用。
  - name: 链路自检
    mode: any
    keywords: ["机器人自检"]
    reply: "自检通过：长连接正常，已收到群消息并成功回复。"
    at_sender: true
    cooldown: 0

  # 山城卡单独给固定话术。
  #
  # 【为什么用规则而不是交给模型】：山城卡是固定产品，话术要统一，
  # 模型每次生成的措辞都不一样。规则命中会直接回复并 return，不走模型。
  #
  # 【为什么排除了带宽带档位的】：「新增139宽带+山城卡」这种混合单，
  # 主体是 139 宽带，要走模型才能正确计入战报。被山城卡规则抢走的话，
  # 那单的宽带和中高套就不计数了。所以用 regex 加了负向断言。
  - name: 山城卡
    mode: regex
    # 排除三类：① 带宽带档位的混合单（走模型才能计数）② 疑问句（交问答助手）
    # ③ 报障 / 退订 / 咨询 / 催单（「山城卡坏了」「山城卡退了」不是业绩，以前也会被点赞并 @ 人）
    keywords: ['(?s)^(?!.*(?:79|99|139|149|169|199|239|299|399|宽带|融合|FTTR|几|多少|吗|\?|？|怎么|什么|能不能|可以|坏|断|故障|报障|修|退|取消|拆|投诉|咨询|问题|没有|还没|没发|催|快点|记得|要求|请大家|大家|通知)).*山城卡']
    reply: "点赞山城卡👍👍"
    at_sender: true
    cooldown: 0
    # 命中后按「单C」记进清单。不设的话规则直接 return，
    # 这单不会出现在清单和排名里。
    # 【新增/存量只针对宽带】，号卡类一律单C。
    count_as: 单C

  # --------------------------------------------------------
  # 下面两条是接 agent 之前的纯关键词版本，已停用，留作回退。
  #
  # 如果模型效果不理想、或者 API 出问题想临时顶一下：
  #   把这两条的 enabled 改成 true，同时把上面 agent 的 enabled 改成 false。
  #
  # 注意顺序：业绩新增 必须排在 业绩点赞 前面（match_strategy: first 命中即停），
  # 否则「新增79」会被点赞规则先吃掉 —— 这种顺序耦合正是 agent 消掉的东西之一。
  # --------------------------------------------------------
  - name: 业绩新增
    enabled: false
    mode: regex
    keywords: ['新增\s*(79|99|139|169|199|239|299|399)(?!\d)']
    reply: "恭喜新增宽带！！！👍👍"
    at_sender: true
    cooldown: 0

  - name: 业绩点赞
    enabled: false
    mode: any
    keywords: ["79", "99", "139", "169", "199", "239", "299", "399",
               "智屏", "宽带", "云盒"]
    exclude: [
      "?", "？", "怎么", "什么时候", "能不能", "可以吗", "咋",
      "坏", "断", "报障", "故障", "修", "掉线", "没网", "用不了", "装不了", "投诉",
      "退", "取消", "拆机",
      "%", "完成率", "目标", "剩余",
    ]
    reply: "点赞！！！👍👍"
    at_sender: true
    cooldown: 0


# ============================================================
# 营销活动：排名和清单各按什么周期统计
#
#   rank_period    通报里的排名、晒单数据表、表格图 —— 按【天】，每天重新比
#   ledger_period  Excel 里的「清单」记录 —— 按【周】，本周一到周日的单都在一张表里
# 取值：day（当天）/ week（本周一到周日，周一自动翻页）/ fixed（start~end，临时活动用）
# campaign.json 里的单一直都在，只是出表和排名按周期切。
#
# 目标值和权重来自原表 晒单数据!W2 的公式：
#   综合进度 = 新增宽带/8×25% + 中高套/4×30% + 云盒AI智屏/5×15% + 积分/1000×20%
# 四项权重只加到 90%：长续约 / 千兆 / 单号卡 有统计但不参与打分，原表就这样。
# ============================================================
campaign:
  title: 城区营销活动
  rank_period: day
  ledger_period: week
  start: ""            # 仅 fixed 时用，如 2026-09-11
  end: ""              # 仅 fixed 时用，如 2026-09-14
  targets:
    broadband: 8       # 新增宽带目标
    high: 4            # 中高套目标
    box: 5             # 云盒/AI视联网/智屏目标
    points: 1000       # 价值积分目标
    w_broadband: 0.25
    w_high: 0.30
    w_box: 0.15
    w_points: 0.20


# ============================================================
# 业绩通报：一段文字 + 一张表格图 + 一个 Excel
#
# 三种触发：
#   跟单   有新单入清单就通报，但一小时最多一次。间隔没到的会记着，
#          间隔一到补发一次，所以一波连发的最后几单不会漏掉。
#   定点   11:50 / 21:00 各发一次。是【固定】的，不看前面发没发过。
#   命令   群里发「通报」，立刻发一份到当前群。
#
# 定点和跟单都发到 .env 里 FEISHU_CHAT_IDS / WECOM_CHAT_IDS 指定的群；
# 命令发到喊话的那个群。
# ============================================================
bulletin:
  enabled: true

  # 国庆版（09-29）：所有群每半小时，午休不发
  fixed_times: ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "11:50", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "20:50"]
  # 哪几天发定点通报。ISO 星期：周一=1 …… 周日=7
  days: [1, 2, 3, 4, 5, 6, 7]

  follow_orders: false          # 国庆版：有了半小时定点，跟单通报关掉
  min_interval_minutes: 60

  commands: ["通报", "看通报", "看排名", "排名", "清单"]
  command_cooldown: 60

  # 发到群里的是文字 + 晒单情况表格图；Excel 不进群，只生成在 reports/ 目录
  # 给 TeleAgent / 主管本地看（2026-09-21 用户定的）
  with_text: true
  with_image: true
  with_excel: false

  # 生成的图片和 Excel 落在这个目录（相对项目根目录）
  out_dir: reports

  # ---- 文字话术 ----
  # {day}=8.30  {title}=活动名（campaign.title）  {time}=20:55
  header: "{day}{title}截至{time}，各战队发展情况："
  # 按名次依次套用，几条就恭喜几名
  congrats:
    - "恭喜{team}获得第一名🎉🎉🎉"
    - "恭喜{team}获得第二名🎉🎉🎉"
  # {teams} = 末两名去掉「战队」后缀拼起来，如「古南、东林」
  cheer: "{teams}战队加油✊✊✊！"
  footer: "请办理业务还未晒单的小组积极晒单！！！"
  # 一单都没有时不硬排名次，换成这句
  empty: "各战队暂无晒单，请抓紧晒单！"


# ============================================================
# 问答助手：群里 @机器人 问业绩，模型查台账后回答
#
#   @机器人 今天各战队情况        @机器人 杨桐这周多少分
#   @机器人 哪些组还没晒单        @机器人 东林今天办了哪些单
#   @机器人 发一下通报
#
# 数字全部来自代码算好的台账，模型只负责听懂问题和组织语言。
# 只有 @ 了机器人的纯文字消息才会进这里（私聊不用 @），
# 固定格式的晒单哪怕 @ 了也照常走点赞；助手看出是口语报单也会退回点赞流程。
# 复用 agent 段的服务商和 API Key。
# ============================================================
assistant:
  enabled: true
  only_when_mentioned: true
  # 只把「像在提问」的文字交给助手（有问号 / 几 / 多少 / 哪些 / 谁 / 排名 …）。
  # 企微上每条消息都是 @ 来的，不开这个的话每条口语报单都要先白调一次助手模型
  question_only: true
  max_rounds: 4
  timeout: 20
  temperature: 0.2
  max_tokens: 600
  max_calls_per_minute: 20
  at_sender: true
  error_reply: "我这会儿查不了，稍后再问一次。"
  # 额外的业务说明，会拼进助手的系统提示词
  context: |
    群成员的叫法：「战队」也叫「支局」「战区」；「小组」是两人一组，用两个人的名字连着叫。
    「晒单」= 报单 = 办成一单业务后发到群里。「没晒单」= 一单都没有。


# ============================================================
# 晒单容错解析
#
# 「业务晒单时刻」是人手打的，字段名会写歪：「套餐:139」「揽收：郭静」
# 「业务类型 新增」（没冒号）、顺序调换、两个字段挤一行……
# 严格解析抓不到时，只要文字命中了 min_field_hits 个模板字段名，
# 就让模型把字段抽出来，再走和严格解析【同一套】换算规则记进清单。
# 这样记的单一律标待核对（Excel 里标黄，备注「模型解析待核对」）。
#
# 发给模型前先脱敏（业务号码抹掉）；模型只许抽文字里明确写了的，
# 缺业务类型或套餐就放弃；一条消息报多单的不自动拆。
# 复用 agent 段的服务商和 API Key。
# ============================================================
extract:
  enabled: true
  min_field_hits: 2
  timeout: 12
  temperature: 0
  max_tokens: 300
  max_calls_per_minute: 30


# ============================================================
# 表情包
#
# 点赞之后再发一张表情包图片。
#
# ⚠️ 只有企业微信支持，而且要配长连接凭证（.env 里的
#    WECOM_BOT_ID / WECOM_BOT_SECRET）—— 企微发图必须要 media_id，
#    而 media_id 只能通过长连接上传获得，MCP 那条通道没有上传能力。
#    没配凭证的话这里开着也不生效，只是文字点赞照常。
#
# 图片放 assets/stickers/ 目录，png/jpg/jpeg/gif 都行。
# media_id 有效期只有 3 天，机器人会自动缓存并到期重传，不用管。
# ============================================================
stickers:
  enabled: true

  # 图片目录，相对项目根目录
  directory: assets/stickers

  # media_id 缓存文件。删掉会导致全部重传，不影响正确性
  cache_file: stickers_cache.json

  # 同一分类里，最近用过的这么多张不再重复挑
  avoid_last: 3

  # 点赞时跟几张表情包
  praise_count: 2
  # 这一条同时触发捷报时，点赞图减到几张。
  # 不减的话第 4 条业绩会一次刷出「文字 + 2 张点赞 + 1 张捷报」共 4 条消息
  praise_count_on_streak: 1

  # ----------------------------------------------------------
  # 活跃时段：【自动发图】只在这个窗口内。
  # 点赞和捷报是跟着消息走的，不受这个限制 —— 有人报单就回。
  # 受限制的是「全力以赴」和每日定点那几个。
  #
  # active_days 用 ISO 星期：周一=1 …… 周日=7
  # ----------------------------------------------------------
  active_days: [4, 5, 6, 7]      # 周四到周日
  active_start: "08:30"
  active_end: "20:30"

  # ---- 捷报频传：业绩扎堆时 ----
  streak_enabled: true
  # 1 小时窗口内累计到第几条时触发（4 = 第 4 条才发）
  streak_threshold: 4
  streak_count: 1
  # 触发后这么久内不再发 —— 否则业绩连来时每条后面都跟一张
  streak_cooldown_minutes: 60

  # ---- 全力以赴：长时间没业绩时 ----
  idle_enabled: true
  idle_after_minutes: 60         # 冷清多久算冷清
  idle_repeat_minutes: 60        # 持续冷清时每隔多久再发
  idle_count: 2
  idle_bonus_probability: 0.5    # 按这个概率再追一张晒单

  # ---- 每日定点 ----
  # 到点后 10 分钟内都算数：进程刚好在那一分钟没跑也能补上。
  #
  # 每条可以单独配 days（ISO 星期，周一=1 …… 周日=7）；
  # 不配就沿用上面的 active_days。
  daily:
    # 早上加油【天天发】，不跟着周四到周日
    - {at: "08:30", category: "早上加油", count: 1, days: [1, 2, 3, 4, 5, 6, 7]}
    # 下午加油沿用 active_days，也就是周四到周日
    - {at: "14:00", category: "下午加油", count: 1}

# ================================================================
# 打卡核验（2026-09-24 和业务确认的口径，详见 botcore/checkin.py 开头）
# 每张「今日水印」照片算一次打卡：
#   ① 工作内容里有办成的业务（新增 / 续签 / 改档 / 号卡 / 拆机维系成功）→ 记成业务，表里填绿
#   ② 工作内容是 keep_as_is 里的工作类型 → 原样写进格子
#   ③ 其余视觉模型看照片：现场拦截 / 设备演示 / 板夹打卡 / 算账打卡 / 无效打卡（填红）
# 通报的 Excel 和 TeleAgent 导出的 Excel 里，附当天上午 / 下午 / 晚上三张「打卡」表
# ================================================================
checkin:
  enabled: true
  slots:
    - {name: 上午, start: "08:30", end: "11:50"}
    - {name: 下午, start: "14:00", end: "18:00"}
    - {name: 晚上, start: "18:00", end: "21:00"}
  keep_as_is: [异网打卡, 拆机维系, {match: 搬家打卡, label: 板夹打卡}]   # 搬家 = 板夹的同音错字
  columns: 13          # 表里至少留几户（通报样表是第 1 ~ 13 户）
  span: "9.24-9.27"    # 标题里的活动日期；换活动时改这里，留空就写当天
  # 打卡通报（09-24 用户定的时刻，11:50、18:00 统计刚结束的时段），发「文字 + 打卡表图」；群里喊「打卡通报」立刻发
  bulletin_enabled: true
  bulletin_times: ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "11:50", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "20:50"]
  bulletin_days: [4, 5, 6, 7]    # 周四到周日，和表情包活跃日一致
  bulletin_commands: [打卡通报, 打卡情况]
  vision_model: qwen3-vl-plus
  vision_api_key_env: VISION_API_KEY
  vision_max_calls_per_minute: 20

# ================================================================
# 数据备份（09-28）：服务器每天 02:30 快照（cron 跑 python -m botcore.backup snapshot）、
# 台账 / 打卡 / 名册每次保存前留底、管理员单聊「备份」「备份 9.25」取备份包
# 备份包不含 .env（密钥）、打卡样本照片、reports/
# ================================================================
backup:
  admins: [HuangTao]      # 能单聊取备份的人（企微账号 ID）；台账是全员业绩明细，别乱加
  notify: [HuangTao]      # 单聊提醒只发给谁（认不出的人晒单、视觉模型额度 / 换模型）；管理员再多也只发这里
  keep_days: 14           # 每日快照留几天


# ============================================================
